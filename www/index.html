<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>lstk Demo</title>
  <style>
    :root {
      --dark: #1A1C28;
      --card: #2D3042;
      --light: #EAEAF0;
      --muted: #9095B8;
      --violet: #4D0DCF;
      --blue: #5D79FF;
      --cyan: #38FFF3;
      --orange: #F24D3A;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 85% 15%, rgba(93, 121, 255, 0.35), transparent 45%),
        radial-gradient(circle at 90% 85%, rgba(77, 13, 207, 0.35), transparent 45%),
        radial-gradient(circle at 10% 90%, rgba(56, 255, 243, 0.12), transparent 40%),
        var(--dark);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--light);
      padding: 24px;
    }

    .card {
      max-width: 640px;
      width: 100%;
      background: rgba(45, 48, 66, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 48px 44px;
      backdrop-filter: blur(6px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      text-align: center;
    }

    .logo {
      width: 56px;
      height: 56px;
      margin-bottom: 28px;
    }

    h1 {
      font-size: 32px;
      font-weight: 600;
      margin: 0 0 14px;
      letter-spacing: -0.02em;
    }

    p.subtitle {
      font-size: 16px;
      line-height: 1.6;
      color: var(--muted);
      margin: 0 0 32px;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 32px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      color: var(--light);
    }

    .badge.violet { background: rgba(77, 13, 207, 0.35); border: 1px solid rgba(176, 140, 249, 0.4); }
    .badge.blue   { background: rgba(93, 121, 255, 0.25); border: 1px solid rgba(93, 121, 255, 0.45); }
    .badge.orange { background: rgba(242, 77, 58, 0.25); border: 1px solid rgba(242, 77, 58, 0.45); }

    .badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--cyan);
    }

    .terminal {
      display: inline-block;
      font-family: "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
      font-size: 13px;
      color: var(--cyan);
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 10px 18px;
    }

    .terminal .prompt {
      color: var(--muted);
      margin-right: 8px;
    }

    footer {
      margin-top: 28px;
      font-size: 12.5px;
      color: var(--muted);
    }
  </style>
</head>
